<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0038FF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sales Hub" />
  <meta name="description" content="Sales Hub for managing tenants and dues" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Sales Hub</title>
  <style>
    :root { --bg:#f3f6fb; --card:#fff; --line:#e3e8ef; --text:#2e3337; --muted:#667085; --blue:#0038ff; --cyan:#00fff0; --red:#e11d48; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.4 Inter, system-ui, sans-serif; color:var(--text); background:var(--bg); }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    a { color:var(--blue); }
    .app { width:min(480px,100%); margin:0 auto; min-height:100dvh; padding:16px 14px calc(76px + env(safe-area-inset-bottom)); }
    .brand { font-weight:800; letter-spacing:-.04em; font-size:1.3rem; }
    .brand span { color:var(--cyan); }
    .topbar { position:sticky; top:0; z-index:4; background:var(--blue); color:#fff; margin:-16px -14px 14px; padding:18px 14px 16px; border-radius:0 0 20px 20px; }
    .switch { position:relative; margin-bottom:12px; }
    .switch-btn { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; background:rgba(255,255,255,.16); color:#fff; border:0; border-radius:12px; padding:12px 14px; font-weight:800; font-size:1.05rem; text-align:left; }
    .switch-menu { margin-top:8px; background:#fff; color:var(--text); border-radius:14px; max-height:50dvh; overflow:auto; }
    .switch-menu button { display:block; width:100%; text-align:left; background:#fff; color:var(--text); border:0; border-bottom:1px solid var(--line); border-radius:0; padding:12px 14px; font-weight:700; }
    .switch-menu button.on { color:var(--blue); background:#eef3ff; }
    .topbar .brand, .topbar .muted { color:#fff; }
    .topbar .brand span { color:var(--cyan); }
    .topbar .ghost { background:rgba(255,255,255,.16); color:#fff; border:0; }
    .muted { color:var(--muted); font-size:.82rem; }
    .row { display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .card, .item, .preview { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
    .card { margin-top:12px; }
    h1, h2 { font-size:1.05rem; margin:0 0 6px; }
    label { display:grid; gap:4px; font-size:.75rem; color:var(--muted); font-weight:600; }
    input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--text); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .btn { border:0; border-radius:10px; padding:10px 14px; font-weight:700; }
    .primary { background:var(--blue); color:#fff; }
    .ghost { background:#f7f9fc; color:var(--text); border:1px solid var(--line); }
    .full { width:100%; }
    .err { background:#fff1f2; color:var(--red); border-radius:10px; padding:8px 10px; margin-top:8px; font-size:.85rem; }
    .chips { display:flex; gap:6px; overflow:auto; margin:10px 0; }
    .chip, .tab button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 10px; font-weight:700; font-size:.8rem; white-space:nowrap; }
    .chip.on, .tab button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
    .topbar .chip { background:rgba(255,255,255,.16); color:#fff; border-color:transparent; }
    .topbar .chip.on { background:#fff; color:var(--blue); }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .stat { text-align:left; }
    .stat strong { display:block; font-size:1.05rem; }
    .list { display:grid; gap:8px; margin-top:8px; }
    .item { width:100%; text-align:left; }
    .meta { display:flex; flex-wrap:wrap; gap:6px 10px; color:var(--muted); font-size:.78rem; margin-top:4px; }
    .tab { position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:min(480px,100%); display:grid; grid-template-columns:repeat(6,1fr); gap:4px; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.96); border-top:1px solid var(--line); }
    .tab button { border-radius:12px; padding:10px 2px; font-size:.68rem; }
    .app:has(.market) { height:100dvh; min-height:0; display:flex; flex-direction:column; overflow:hidden; padding-bottom:0; }
    .market { --ink:#102033; --paper:#f4f7fb; --rule:rgba(16,32,51,.1); --up:#0c6b45; --down:#a32020; --muted:#5c6b7a; margin:0 -14px; padding:14px 14px 12px; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; gap:8px; flex:1; min-height:0; margin-bottom:calc(64px + env(safe-area-inset-bottom)); overflow:hidden; font-family:"Avenir Next","Segoe UI",sans-serif; }
    .blotter { flex:1; display:flex; flex-direction:column; min-height:0; }
    .market-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .market-top p, .blotter-kicker, .blotter-target, .blotter-facts dt { margin:0; color:var(--muted); font-size:.68rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
    .market h2 { margin:0; color:var(--ink); font-size:1.15rem; letter-spacing:-.03em; }
    .market-refresh { border:0; background:transparent; color:var(--ink); min-height:40px; padding:6px 10px; font-weight:650; }
    .price-pair { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:2px; }
    .price-up, .price-down { border-radius:12px; padding:6px 8px 7px; }
    .price-up { background:linear-gradient(160deg,#d9fbe8,#b6f3d0); }
    .price-down { background:linear-gradient(160deg,#ffe1e1,#ffc4c4); }
    .price-up .blotter-kicker { color:#0c6b45; }
    .price-down .blotter-kicker { color:#a32020; }
    .blotter-last { margin:2px 0 0; font-size:1.28rem; font-weight:700; letter-spacing:-.04em; font-variant-numeric:tabular-nums; line-height:1; }
    .blotter-delta { display:flex; align-items:baseline; gap:8px; margin:7px 0 0; font-weight:650; font-variant-numeric:tabular-nums; }
    .blotter-delta span { color:var(--muted); font-family:"Avenir Next","Segoe UI",sans-serif; font-size:.75rem; font-weight:550; }
    .up { color:var(--up); } .down { color:var(--down); }
    .ruler { position:relative; height:10px; margin-top:8px; border-radius:99px; background:#ffc9c9; overflow:hidden; }
    .ruler .fill { display:block; height:10px; margin-top:0; border-radius:99px; background:linear-gradient(90deg,#0c6b45,#3ddea0); }
    .ruler i { position:absolute; top:0; width:1px; height:10px; background:var(--down); }
    .blotter-facts { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:6px 0 0; padding-top:6px; border-top:1px solid var(--rule); }
    .blotter-facts dd { margin:2px 0 0; font-variant-numeric:tabular-nums; }
    .quote-book { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:7px; align-content:stretch; min-height:0; margin-top:8px; }
    .quote-row { display:grid; grid-template-columns:1fr auto; align-content:center; gap:1px 6px; min-height:0; padding:7px 8px; border:1px solid var(--rule); border-radius:10px; background:#fff; }
    .quote-row strong { font-size:1.02rem; font-weight:650; }
    .quote-row em, .quote-row .px, .quote-row .of { font-style:normal; font-variant-numeric:tabular-nums; }
    .quote-row em { justify-self:end; font-size:.95rem; font-weight:650; }
    .quote-row .px { grid-column:1 / -1; font-size:1.02rem; font-weight:650; border-radius:4px; }
    .quote-row .of { grid-column:1 / -1; justify-self:start; color:var(--muted); font-size:.72rem; font-weight:550; }
    @keyframes blink-green { 0%, 49% { color:#0c6b45; } 50%, 100% { color:#3ddea0; } }
    @keyframes blink-red { 0%, 49% { color:#a32020; } 50%, 100% { color:#ff7a7a; } }
    .quote-row.up em, .quote-row.up .px, .blotter-delta .up, .blotter-last.up { color:var(--up); animation:blink-green 1.8s steps(1) infinite; }
    .quote-row.down em, .quote-row.down .px, .blotter-delta .down, .blotter-last.down { color:var(--down); animation:blink-red 1.8s steps(1) infinite; }
    .blotter-last { border-radius:4px; }
    @media (prefers-reduced-motion: reduce) {
      .quote-row.up em, .quote-row.up .px, .quote-row.down em, .quote-row.down .px, .blotter-delta .up, .blotter-delta .down, .blotter-last.up, .blotter-last.down { animation:none; }
    }
    .market-wait { margin:0; color:var(--muted); }
    .sheet { position:fixed; inset:0; background:rgba(23,32,51,.45); display:flex; align-items:flex-end; justify-content:center; z-index:5; }
    .sheet .panel { width:min(480px,100%); max-height:92dvh; overflow:auto; background:#fff; border-radius:18px 18px 0 0; padding:14px 14px calc(14px + env(safe-area-inset-bottom)); display:grid; gap:8px; }
    .facts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0; }
    .facts dt { color:var(--muted); font-size:.75rem; }
    .facts dd { margin:0; font-weight:700; }
    .preview { background:#f7f9fc; display:grid; gap:3px; font-size:.84rem; }
    .beds { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
    .bed { border-radius:999px; padding:2px 8px; font-size:.72rem; font-weight:700; background:#eef2f7; }
    .hide { display:none; }
  </style>
</head>
<body>
  <div id="root" class="app"></div>
  <script>
    const API = 'https://apiv2.rentok.com';
    const inr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
    const rupee = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
    const rupee2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const TARGETS = [
      { name: 'Amit', target: 800000, eazypgId: '7891233020P' },
      { name: 'Tejas', target: 100000, eazypgId: '7891233020AC' },
      { name: 'Mohit', target: 100000, eazypgId: '7891233020AG' },
      { name: 'Jatin Arora', target: 177000, eazypgId: '7891233020Z' },
      { name: 'Kamalkant', target: 600000, eazypgId: '7891233020S' },
      { name: 'Bharat', target: 500000, eazypgId: '7891233020Q' },
      { name: 'Sandeep', target: 500000, eazypgId: '7891233020W' },
      { name: 'Pankaj', target: 2300000, eazypgId: '7891233020B' },
    ];
    const state = { session: null, tab: 'home', properties: [], selected: 'all', picker: false, stats: [], cards: [], rows: [], hasMore: false, query: '', peopleView: 'living', loading: false, error: '', sheet: null, dueTypes: [], quoteInputs: null, link: '', adding: false, beds: [], tenant: null, targetRows: [] };

    function $(id) { return document.getElementById(id); }
    function esc(value) { return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch])); }
    function text(value) { return value == null ? '' : String(value).trim(); }
    function num(value) { const n = Number(value); return Number.isFinite(n) ? n : 0; }
    function money(value) { if (typeof value === 'string' && value.includes('₹')) return value; const n = Number(String(value ?? '').replace(/,/g, '')); return Number.isFinite(n) ? inr.format(n) : '—'; }
    function compactInr(value) { const abs = Math.abs(value); const sign = value < 0 ? '-' : ''; if (abs >= 10000000) return sign + '₹' + (abs / 10000000).toFixed(2) + 'Cr'; if (abs >= 100000) return sign + '₹' + (abs / 100000).toFixed(2) + 'L'; return money(value); }
    function flashQuotes() {
      if (!state.quoteMemory) state.quoteMemory = {};
      document.querySelectorAll('.quote-row').forEach((row, index) => {
        const name = row.dataset.name || '';
        const amount = Number(row.dataset.amount);
        const before = state.quoteMemory[name];
        const tick = before == null ? row.dataset.tone : before === amount ? '' : amount > before ? 'up' : 'down';
        state.quoteMemory[name] = amount;
        if (!tick) return;
        row.classList.add(tick === 'up' ? 'tick-up' : 'tick-down');
        const price = row.querySelector('.px');
        if (price) price.style.animationDelay = (index * 70) + 'ms';
      });
      const last = document.querySelector('.blotter-last.up');
      if (!last) return;
      const total = Number(last.dataset.amount);
      const beforeTotal = state.quoteMemory.__total;
      const tick = beforeTotal == null ? (last.classList.contains('up') || document.querySelector('.blotter-delta.up') ? 'up' : 'down') : beforeTotal === total ? '' : total > beforeTotal ? 'up' : 'down';
      state.quoteMemory.__total = total;
      if (tick) last.classList.add(tick === 'up' ? 'tick-up' : 'tick-down');
    }
    function marketBoard(rows) {
      const ranked = rows.slice().sort((a, b) => (b.target ? b.collection / b.target : 0) - (a.target ? a.collection / a.target : 0));
      const totals = rows.reduce((sum, row) => ({ target: sum.target + row.target, collection: sum.collection + row.collection, payments: sum.payments + row.payments }), { target: 0, collection: 0, payments: 0 });
      const rateOf = (collection, target) => target > 0 ? (collection / target) * 100 : 0;
      const end = new Date(2026, 9, 31); const today = new Date(); today.setHours(0, 0, 0, 0);
      const days = Math.max(1, Math.round((end - today) / 86400000) + 1);
      const pace = today >= end ? 100 : (today.getFullYear() === 2026 && today.getMonth() === 9 ? (today.getDate() / 31) * 100 : 0);
      const rate = rateOf(totals.collection, totals.target);
      const gap = rate - pace;
      const up = rate + 0.05 >= pace;
      const left = Math.max(0, totals.target - totals.collection);
      const ruler = (value) => '<div class="ruler" aria-hidden="true"><span class="fill" style="width:' + Math.min(100, Math.max(0, value)).toFixed(1) + '%"></span><i style="left:' + Math.min(100, pace).toFixed(1) + '%"></i></div>';
      const book = '<div class="quote-book">' + ranked.map((row) => {
        const rowRate = rateOf(row.collection, row.target);
        const tone = rowRate + 0.05 >= pace ? 'up' : 'down';
        return '<div class="quote-row ' + tone + '" data-name="' + esc(row.name) + '" data-amount="' + row.collection + '" data-tone="' + tone + '"><strong>' + esc(row.name) + '</strong><em>' + (tone === 'up' ? '▲' : '▼') + ' ' + rowRate.toFixed(1) + '%</em><span class="px">' + esc(money(row.collection)) + '</span><span class="of">target ' + esc(money(row.target)) + '</span></div>';
      }).join('') + '</div>';
      const quote = rows.length ? '<div class="blotter"><div class="price-pair"><div class="price-up"><p class="blotter-kicker">Collected ▲</p><p class="blotter-last up" data-amount="' + totals.collection + '">' + esc(money(totals.collection)) + '</p></div><div class="price-down"><p class="blotter-kicker">Target ▼</p><p class="blotter-last down">' + esc(money(totals.target)) + '</p></div></div><p class="blotter-delta"><span class="' + (up ? 'up' : 'down') + '">' + (up ? '▲' : '▼') + ' ' + rate.toFixed(1) + '%</span><span>' + (gap >= 0 ? '+' : '') + gap.toFixed(1) + ' pts vs ' + pace.toFixed(1) + '% pace</span></p>' + ruler(rate) + '<dl class="blotter-facts"><div><dt>Left</dt><dd>' + esc(compactInr(left)) + '</dd></div><div><dt>Per day</dt><dd>' + esc(compactInr(Math.round(left / days))) + '</dd></div><div><dt>Volume</dt><dd>' + totals.payments + '</dd></div><div><dt>Days</dt><dd>' + days + '</dd></div></dl>' + book + '</div>' : '<p class="market-wait">Loading quotes…</p>';
      return '<section class="market"><div class="market-top"><div><p>October index</p><h2>Team target</h2></div><button type="button" class="market-refresh" id="refresh-target">Refresh</button></div>' + quote + '</section>';
    }
    function digits(value) { return text(value).replace(/\D/g, '').slice(-10); }
    function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    function monthRange() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), 1);
      const end = new Date(now.getFullYear(), now.getMonth()+1, 0);
      const iso = (d) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      return { start: iso(start), end: iso(end), label: now.toLocaleDateString('en-IN', { month: 'long' }) };
    }
    function fingerprint() {
      let id = localStorage.getItem('saleshub-fp');
      if (!id) {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        id = [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem('saleshub-fp', id);
      }
      return id;
    }
    function loadSession() {
      try { return JSON.parse(localStorage.getItem('saleshub-phone') || 'null'); } catch { return null; }
    }
    function saveSession(session) { localStorage.setItem('saleshub-phone', JSON.stringify(session)); state.session = session; }
    function jwtPayload(token) {
      try { return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch { return {}; }
    }
    function looksLikeJwt(value) {
      return typeof value === 'string' && value.length > 40 && value.split('.').length === 3;
    }
    function findToken(node) {
      if (looksLikeJwt(node)) return node;
      if (!node || typeof node !== 'object') return '';
      if (looksLikeJwt(node.jwt_token)) return node.jwt_token;
      if (looksLikeJwt(node.access_token)) return node.access_token;
      if (looksLikeJwt(node.token)) return node.token;
      for (const value of Object.values(node)) { const found = findToken(value); if (found) return found; }
      return '';
    }
    const PROXY = 'https://saleshub-proxy.vercel.app';
    async function apiRoot(force) {
      if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') return 'http://127.0.0.1:3000/api/rentok';
      if (state.proxy && !force) return state.proxy;
      try {
        const cfg = await fetch('./proxy.json?t=' + Date.now(), { cache: 'no-store' });
        const data = await cfg.json();
        if (data && data.url) { state.proxy = data.url; return data.url; }
      } catch (e) {}
      state.proxy = PROXY;
      return PROXY;
    }
    async function api(path, options = {}) {
      const headers = { Accept: 'application/json, text/plain, */*', 'x-rentok-app': 'saleshub' };
      if (options.auth !== false) {
        headers['x-fingerprint'] = fingerprint();
        if (options.platform !== false) headers['x-platform-name'] = 'web';
        if (options.urlPath !== false) headers['x-url-path'] = 'saleshub.rentok.com';
      }
      if (state.session?.token) headers.Authorization = 'Bearer ' + state.session.token;
      let body;
      if (options.form) body = options.form;
      else if (options.json !== undefined) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(options.json); }
      let res;
      try {
        res = await fetch(await apiRoot() + '/' + path, { method: body ? 'POST' : 'GET', headers, body, cache: 'no-store' });
      } catch (e) {
        state.proxy = '';
        try {
          res = await fetch(await apiRoot(true) + '/' + path, { method: body ? 'POST' : 'GET', headers, body, cache: 'no-store' });
        } catch (again) {
          throw new Error('Could not reach Sales Hub. Check your internet and try again.');
        }
      }
      const data = await res.json().catch(() => ({ status: res.status, message: 'Could not reach Sales Hub.' }));
      const status = data.status ?? res.status;
      const sessionEnded = state.session && (status === 401 || status === 403) && /authoriz|session|expired/i.test(String(data.message || ''));
      if (sessionEnded) { signOut('Session expired. Sign in again.'); throw new Error('Session expired.'); }
      if (status < 200 || status >= 300) throw new Error(data.message || 'Request failed');
      return data;
    }
    function selectedNumbers() {
      if (state.selected === 'all') return state.properties.map((p) => p.pgNumber);
      const one = state.properties.find((p) => p.id === state.selected);
      return one ? [one.pgNumber] : [];
    }
    function propertyId() {
      return (state.properties.find((p) => p.id === state.selected) || state.properties[0] || {}).id || '';
    }
    function round2(value) { return Math.round(value * 100) / 100; }
    function parseISO(iso) { const [y,m,d] = iso.split('-').map(Number); return new Date(y, (m||1)-1, d||1); }
    function formatISO(date) { return date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0'); }
    function endForMonths(start, months) { const date = parseISO(start); const end = new Date(date.getFullYear(), date.getMonth()+months, date.getDate()); end.setDate(end.getDate()-1); return formatISO(end); }
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function dmy(date) { return String(date.getDate()).padStart(2,'0') + '/' + String(date.getMonth()+1).padStart(2,'0') + '/' + date.getFullYear(); }
    function mdy(date) { return String(date.getMonth()+1).padStart(2,'0') + '/' + String(date.getDate()).padStart(2,'0') + '/' + date.getFullYear(); }
    function prettyDate(date) { return date.getDate() + ' ' + MONTHS[date.getMonth()] + ' ' + date.getFullYear(); }
    function blankTenant() {
      const propertyId = state.selected === 'all' ? ((state.properties[0] || {}).id || '') : state.selected;
      return { propertyId, name: '', phone: '', bedId: '', rent: '0', deposit: '0', joining: today(), months: '11', notice: '30', lockin: '0', gst: false, whatsapp: true };
    }
    function tenantPayload(form, property, bed) {
      const joining = parseISO(form.joining || today());
      const months = Math.max(1, Math.round(num(form.months)) || 1);
      const checkout = new Date(joining.getFullYear(), joining.getMonth() + months, joining.getDate());
      const monthEnd = new Date(joining.getFullYear(), joining.getMonth() + 1, 0);
      const duration = Math.round((monthEnd.getTime() - joining.getTime()) / 86400000) + 1;
      const rent = Math.max(0, num(form.rent));

      $('out').onclick = () => signOut();
      $('switch').onclick = () => { state.picker = !state.picker; render(); };
      root.querySelectorAll('[data-pg]').forEach((button) => button.onclick = async () => { state.selected = button.dataset.pg; state.picker = false; state.rows = []; state.loading = true; render(); try { await loadTab(true); } catch (e) { state.error = e.message; } state.loading = false; render(); });
      root.querySelectorAll('[data-tab]').forEach((button) => button.onclick = async () => { state.tab = button.dataset.tab; state.rows = []; state.query = ''; state.loading = true; render(); try { await loadTab(true); } catch (e) { state.error = e.message; } state.loading = false; render(); });
      root.querySelectorAll('[data-go]').forEach((button) => button.onclick = () => { const action = button.dataset.go; state.tab = action.includes('collection') ? 'paid' : action.includes('dues') ? 'dues' : action.includes('rooms') ? 'rooms' : 'people'; state.rows = []; render(); loadTab(true).then(render).catch((e) => { state.error = e.message; render(); }); });
      root.querySelectorAll('[data-open]').forEach((button) => button.onclick = () => openTenant(visibleRows()[Number(button.dataset.open)]));
      const q = $('q'); if (q) q.oninput = () => { state.query = q.value; const list = root.querySelector('.list'); if (list) list.innerHTML = visibleRows().map(itemHtml).join(''); root.querySelectorAll('[data-open]').forEach((button) => button.onclick = () => openTenant(visibleRows()[Number(button.dataset.open)])); };
      const setPeople = async (view) => { state.peopleView = view; state.rows = []; state.loading = true; render(); try { await loadTab(true); } catch (e) { state.error = e.message; } state.loading = false; render(); };
      const living = $('living'); if (living) living.onclick = () => setPeople('living');
      const renewal = $('renewal'); if (renewal) renewal.onclick = () => setPeople('renewal');
      const old = $('old'); if (old) old.onclick = () => setPeople('out');
      const more = $('more'); if (more) more.onclick = async () => { try { await loadTab(false); render(); } catch (e) { state.error = e.message; render(); } };
      const openAdd = () => { state.sheet = null; state.adding = true; state.tenantError = ''; state.tenant = blankTenant(); state.beds = []; render(); const property = state.properties.find((item) => item.id === state.tenant.propertyId); if (property) loadBeds(property).then(() => paintBeds()).catch((e) => { state.tenantError = e.message; const box = $('tenant-error'); if (box) box.textContent = e.message; else render(); }); };
      const addBtn = $('add-tenant'); if (addBtn) addBtn.onclick = openAdd;
      const addHome = $('add-home'); if (addHome) addHome.onclick = openAdd;
      const targetHome = $('target-home'); if (targetHome) targetHome.onclick = () => { state.tab = 'target'; state.loading = true; render(); loadTab(true).then(() => { state.loading = false; render(); }).catch((e) => { state.error = e.message; state.loading = false; render(); }); };
      const refreshTarget = $('refresh-target'); if (refreshTarget) refreshTarget.onclick = () => { state.forceTarget = true; state.loading = true; render(); loadTab(true).then(() => { state.loading = false; render(); }).catch((e) => { state.error = e.message; state.loading = false; render(); }); };
      flashQuotes();
      if (state.session && state.tab === 'target') {
        if (!state.tapeTimer) state.tapeTimer = setInterval(() => { if (state.tab !== 'target' || state.loading) return; state.forceTarget = true; loadTab(true).then(() => render()).catch(() => {}); }, 40000);
      } else if (state.tapeTimer) { clearInterval(state.tapeTimer); state.tapeTimer = 0; }
      bindSheet();
      bindAdd();
    }
    function quotePreviewHtml() {
      const quote = currentQuote();
      if (!quote) return '<p class="muted">Enter a price, units, and months.</p>';
      return '<div class="preview"><div>' + quote.totalUnits + ' × ₹' + quote.originalUnitCost + ' × ' + quote.months + ' months</div><div>Through ' + quote.dueEndDate + ' · ' + quote.days + ' days</div><div>Before discount ' + inr.format(quote.originalAmount) + '</div><div>Discount ' + inr.format(Math.round(quote.discountValue)) + ' · GST ' + inr.format(quote.gstAmount) + '</div><strong>' + inr.format(quote.amount) + ' to collect</strong></div>';
    }
    function paintQuote() {
      const box = $('quote-preview');
      if (box) box.innerHTML = quotePreviewHtml();
      if (!state.link) { const linkBox = $('quote-link'); if (linkBox) linkBox.innerHTML = ''; }
    }
    function paintDueTypes() {
      const plan = $('plan');
      if (!plan || !state.quoteInputs) return;
      const selected = state.quoteInputs.typeId;
      plan.innerHTML = state.dueTypes.map((type) => '<option value="' + esc(type.id) + '">' + esc(type.name) + (type.unitCost ? ' · ₹' + type.unitCost : '') + '</option>').join('');
      if (selected) plan.value = selected;
      const price = $('price');
      if (price && document.activeElement !== price) price.value = state.quoteInputs.price || '';
      paintQuote();
    }
    function sheetHtml() {
      const row = state.sheet; if (!row) return '';
      const phone = digits(row.phone || row.tenant_number);
      const types = state.dueTypes.map((type) => '<option value="' + esc(type.id) + '"' + (state.quoteInputs && state.quoteInputs.typeId === type.id ? ' selected' : '') + '>' + esc(type.name) + (type.unitCost ? ' · ₹' + type.unitCost : '') + '</option>').join('');
      const input = state.quoteInputs || {};
      const link = '<div id="quote-link">' + (state.link ? '<div class="preview"><a href="' + esc(state.link) + '" target="_blank">' + esc(state.link) + '</a><div class="actions"><button class="btn ghost" id="copy">Copy link</button>' + (state.shareText ? '<a class="btn primary" target="_blank" href="https://wa.me/' + (phone ? '91' + phone : '') + '?text=' + encodeURIComponent(state.shareText) + '">WhatsApp link</a>' : '') + '</div></div>' : '') + '</div>';
      return '<div class="sheet" id="sheet"><div class="panel"><div class="row"><strong>' + esc(row.name || row.tenant_name || 'Tenant') + '</strong><button class="btn ghost" id="close">Close</button></div><p class="muted">' + esc(text(row.room || row.tenant_room) || 'No room') + ' · ' + esc(row.pg_name) + '</p><div class="actions">' + (phone ? '<a class="btn primary" href="tel:' + phone + '">Call</a><a class="btn ghost" target="_blank" href="https://wa.me/91' + phone + '">WhatsApp</a>' : '') + '</div><h2>Add due</h2><label>Plan<select id="plan">' + types + '</select></label><div class="grid"><label>Unit price<input id="price" inputmode="decimal" value="' + esc(input.price || '') + '"></label><label>Units<input id="units" inputmode="numeric" value="' + esc(input.units || '1') + '"></label><label>Months<input id="months" inputmode="numeric" value="' + esc(input.months || '1') + '"></label><label>Discount / unit<input id="discount" inputmode="decimal" value="' + esc(input.discount || '0') + '"></label></div><label>Starts<input id="start" type="date" value="' + esc(input.start || today()) + '"></label><div id="quote-preview">' + quotePreviewHtml() + '</div>' + (state.error ? '<div class="err">' + esc(state.error) + '</div>' : '') + '<button class="btn primary full" id="adddue">' + (state.loading ? 'Adding…' : 'Add due and payment link') + '</button>' + link + '</div></div>';
    }
    function readQuoteInputs() {
      if (!state.quoteInputs) state.quoteInputs = {};
      const plan = $('plan'), price = $('price'), units = $('units'), months = $('months'), discount = $('discount'), start = $('start');
      if (plan) state.quoteInputs.typeId = plan.value;
      if (price) state.quoteInputs.price = price.value;
      if (units) state.quoteInputs.units = units.value;
      if (months) state.quoteInputs.months = months.value;
      if (discount) state.quoteInputs.discount = discount.value;
      if (start) state.quoteInputs.start = start.value;
    }
    function bindSheet() {
      const close = $('close'); if (close) close.onclick = () => { state.sheet = null; state.error = ''; render(); };
      const sheet = $('sheet'); if (sheet) sheet.onclick = (event) => { if (event.target === sheet) { state.sheet = null; render(); } };
      const plan = $('plan'); if (plan) plan.onchange = () => { readQuoteInputs(); const type = state.dueTypes.find((item) => item.id === plan.value); if (type && type.unitCost) state.quoteInputs.price = String(type.unitCost); state.link = ''; render(); };
      ['price','units','months','discount'].forEach((id) => { const el = $(id); if (!el) return; el.onfocus = () => { if (el.value === '0') el.value = ''; else el.select(); }; el.oninput = () => { readQuoteInputs(); state.link = ''; paintQuote(); }; });
      const start = $('start'); if (start) start.oninput = () => { readQuoteInputs(); state.link = ''; paintQuote(); };
      const add = $('adddue'); if (add) add.onclick = () => { readQuoteInputs(); addDue(); };
      const copy = $('copy'); if (copy) copy.onclick = () => navigator.clipboard.writeText(state.link).then(() => { copy.textContent = 'Copied'; });
    }
    function addSheetHtml() {
      if (!state.adding || !state.tenant) return '';
      const form = state.tenant;
      const property = state.properties.find((item) => item.id === form.propertyId) || null;
      const bed = state.beds.find((item) => item.id === form.bedId) || null;
      const payload = property && bed ? tenantPayload(form, property, bed) : null;
      const first = payload ? payload.opening_balance_array[0] : null;
      const depositDue = payload ? payload.opening_balance_array[1] : null;
      const propertyOptions = state.properties.map((item) => '<option value="' + esc(item.id) + '"' + (form.propertyId === item.id ? ' selected' : '') + '>' + esc(item.name) + '</option>').join('');
      const bedOptions = state.beds.map((item) => '<option value="' + esc(item.id) + '"' + (form.bedId === item.id ? ' selected' : '') + '>' + esc(item.label) + '</option>').join('');
      const preview = '<div id="tenant-preview">' + (payload ? '<div class="preview"><div>Checkout ' + esc(payload.checkout_date) + '</div><div>' + esc(first.description) + ' ' + inr.format(first.amount) + '</div><div class="muted">' + esc(first.otherDescription) + '</div><div>Security deposit ' + inr.format(depositDue.amount) + '</div></div>' : '<p class="muted">' + (state.beds.length ? 'Choose a room.' : 'Loading rooms…') + '</p>') + '</div>';
      return '<div class="sheet" id="add-sheet"><div class="panel"><div class="row"><h2>Add tenant</h2><button class="btn ghost" id="add-close" type="button">Close</button></div><label>Property<select id="t-property">' + propertyOptions + '</select></label><label>Name<input id="t-name" value="' + esc(form.name) + '" placeholder="Tenant name"></label><label>Phone<input id="t-phone" inputmode="numeric" maxlength="10" value="' + esc(form.phone) + '" placeholder="10-digit mobile"></label><label>Room<select id="t-bed">' + (bedOptions || '<option value="">No rooms</option>') + '</select></label><div class="grid"><label>Monthly rent<input id="t-rent" inputmode="decimal" value="' + esc(form.rent) + '"></label><label>Security deposit<input id="t-deposit" inputmode="decimal" value="' + esc(form.deposit) + '"></label><label>Joining<input id="t-join" type="date" value="' + esc(form.joining) + '"></label><label>Agreement months<input id="t-months" inputmode="numeric" value="' + esc(form.months) + '"></label><label>Notice days<input id="t-notice" inputmode="numeric" value="' + esc(form.notice) + '"></label><label>Lock-in months<input id="t-lockin" inputmode="numeric" value="' + esc(form.lockin) + '"></label></div><label><input id="t-gst" type="checkbox"' + (form.gst ? ' checked' : '') + '> GST on rent</label><label><input id="t-wa" type="checkbox"' + (form.whatsapp ? ' checked' : '') + '> WhatsApp updates</label>' + preview + '<div class="err" id="tenant-error"' + (state.tenantError ? '' : ' style="display:none"') + '>' + esc(state.tenantError || '') + '</div>' + '<button class="btn primary full" id="t-save" type="button">' + (state.savingTenant ? 'Adding…' : 'Add tenant') + '</button></div></div>';
    }
    function readTenant() {
      if (!state.tenant) return;
      [['t-name','name'],['t-phone','phone'],['t-rent','rent'],['t-deposit','deposit'],['t-join','joining'],['t-months','months'],['t-notice','notice'],['t-lockin','lockin'],['t-bed','bedId'],['t-property','propertyId']].forEach((pair) => { const el = $(pair[0]); if (el) state.tenant[pair[1]] = el.value; });
      const gst = $('t-gst'); if (gst) state.tenant.gst = gst.checked;
      const wa = $('t-wa'); if (wa) state.tenant.whatsapp = wa.checked;
    }
    function tenantPreviewHtml() {
      if (!state.tenant) return '';
      const form = state.tenant;
      const property = state.properties.find((item) => item.id === form.propertyId) || null;
      const bed = state.beds.find((item) => item.id === form.bedId) || null;
      const payload = property && bed ? tenantPayload(form, property, bed) : null;
      const first = payload ? payload.opening_balance_array[0] : null;
      const depositDue = payload ? payload.opening_balance_array[1] : null;
      if (!payload) return '<p class="muted">' + (state.beds.length ? 'Choose a room.' : 'Loading rooms…') + '</p>';
      return '<div class="preview"><div>Checkout ' + esc(payload.checkout_date) + '</div><div>' + esc(first.description) + ' ' + inr.format(first.amount) + '</div><div class="muted">' + esc(first.otherDescription) + '</div><div>Security deposit ' + inr.format(depositDue.amount) + '</div></div>';
    }
    function paintTenant() {
      const box = $('tenant-preview');
      if (box) box.innerHTML = tenantPreviewHtml();
    }
    function paintBeds() {
      const select = $('t-bed');
      if (!state.adding || !select) return;
      const current = state.tenant ? state.tenant.bedId : '';
      select.innerHTML = state.beds.map((item) => '<option value="' + esc(item.id) + '">' + esc(item.label) + '</option>').join('') || '<option value="">No rooms</option>';
      if (current && [...select.options].some((option) => option.value === current)) select.value = current;
      else if (state.tenant) state.tenant.bedId = select.value;
      paintTenant();
    }
    function bindAdd() {
      const close = $('add-close'); if (close) close.onclick = () => { state.adding = false; state.tenantError = ''; render(); };
      const sheet = $('add-sheet'); if (sheet) sheet.onclick = (event) => { if (event.target === sheet) { state.adding = false; render(); } };
      const property = $('t-property');
      if (property) property.onchange = () => { readTenant(); state.beds = []; state.tenant.bedId = ''; paintBeds(); const next = state.properties.find((item) => item.id === state.tenant.propertyId); if (next) loadBeds(next).then(() => paintBeds()).catch((e) => { state.tenantError = e.message; const box = $('tenant-error'); if (box) box.textContent = e.message; }); };
      ['t-rent','t-deposit','t-months','t-notice','t-lockin'].forEach((id) => { const el = $(id); if (el) el.onfocus = () => { if (el.value === '0') el.value = ''; else el.select(); }; });
      ['t-name','t-phone','t-rent','t-deposit','t-join','t-months','t-notice','t-lockin','t-bed'].forEach((id) => {
        const el = $(id);
        if (!el) return;
        const update = () => { readTenant(); paintTenant(); };
        el.oninput = update;
        el.onchange = update;
      });
      const gst = $('t-gst'); if (gst) gst.onchange = () => { readTenant(); paintTenant(); };
      const wa = $('t-wa'); if (wa) wa.onchange = () => { readTenant(); paintTenant(); };
      const save = $('t-save');
      if (save) save.onclick = async () => {
        readTenant();
        const form = state.tenant;
        const chosen = state.properties.find((item) => item.id === form.propertyId);
        const bed = state.beds.find((item) => item.id === form.bedId);
        if (!chosen || !bed) { state.tenantError = 'Choose a property and a room.'; render(); return; }
        if (!text(form.name)) { state.tenantError = 'Enter the tenant name.'; render(); return; }
        if (!/^\d{10}$/.test(digits(form.phone))) { state.tenantError = 'Enter a 10-digit phone number.'; render(); return; }
        state.savingTenant = true; state.tenantError = ''; render();
        try {
          await api('tenant/addTenant', { json: tenantPayload(form, chosen, bed) });
          state.adding = false; state.rows = []; state.loading = true;
          await loadTab(true);
        } catch (e) { state.tenantError = e.message; }
        state.savingTenant = false; state.loading = false; render();
      };
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    }
    state.session = loadSession();
    if (state.session && state.session.token && state.session.pgId) boot(); else render();
  </script>
</body>
</html>
